<!doctype html>
<!-- Ikona aplikácie Písomné maturity. ?maskable=1 = plný štvorec s hrotom v bezpečnej zóne (Android),
     ?square=1 = plný štvorec bez zaoblenia (apple-touch-icon); inak zaoblená ikona s priehľadnými rohmi. -->
<html lang="sk">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg id="m" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" width="64" height="64" rx="14" fill="#1e2a5e" />
  <g id="art"><g transform="rotate(40 32 32)"><path d="M32 54 21.4 34c-1.8-3.4-1-7.6 2-10.4V11h17.2v12.6c3 2.8 3.8 7 2 10.4Z" fill="#d1a24a"/><rect x="23.4" y="16.6" width="17.2" height="1.8" fill="#1e2a5e"/><circle cx="32" cy="30" r="3.1" fill="#1e2a5e"/><rect x="31.15" y="32" width="1.7" height="20" fill="#1e2a5e"/></g></g>
</svg>
<script>
  const q = new URLSearchParams(location.search);
  const bg = document.getElementById('bg');
  if (q.get('maskable') === '1' || q.get('square') === '1') bg.setAttribute('rx', '0');
  // maskable: obsah v strednom kruhu ~80 % (bezpečná zóna), preto hrot zmenšený
  if (q.get('maskable') === '1') document.getElementById('art').setAttribute('transform', 'translate(32 32) scale(0.74) translate(-32 -32)');
  if (q.get('square') === '1') document.getElementById('art').setAttribute('transform', 'translate(32 32) scale(0.88) translate(-32 -32)');
</script>
</body>
</html>
